<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2a1414"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- parchment card -->
  <rect x="90" y="120" width="1020" height="390" rx="14" fill="#f8f5f2"/>
  <rect x="90" y="120" width="1020" height="70" rx="14" fill="#6b0000"/>
  <rect x="90" y="176" width="1020" height="14" fill="#6b0000"/>

  <text x="130" y="165" font-family="Georgia, serif" font-size="34" fill="#ffffff" font-weight="bold">⚔ NPC Stat Box</text>

  <text x="130" y="250" font-family="Georgia, serif" font-size="22" fill="#2b2b2b" font-weight="bold">Full stat blocks, dice rolls, and combat —</text>
  <text x="130" y="285" font-family="Georgia, serif" font-size="22" fill="#2b2b2b" font-weight="bold">right inside Owlbear Rodeo.</text>

  <!-- feature chips -->
  <g font-family="Georgia, serif" font-size="16" fill="#6b0000">
    <rect x="130" y="320" width="140" height="34" rx="17" fill="#fff8f0" stroke="#c9a87a"/>
    <text x="150" y="342">Click-to-roll</text>

    <rect x="285" y="320" width="130" height="34" rx="17" fill="#fff8f0" stroke="#c9a87a"/>
    <text x="305" y="342">HP tracking</text>

    <rect x="430" y="320" width="150" height="34" rx="17" fill="#fff8f0" stroke="#c9a87a"/>
    <text x="450" y="342">Combat resolver</text>

    <rect x="595" y="320" width="130" height="34" rx="17" fill="#fff8f0" stroke="#c9a87a"/>
    <text x="615" y="342">Initiative</text>

    <rect x="740" y="320" width="150" height="34" rx="17" fill="#fff8f0" stroke="#c9a87a"/>
    <text x="760" y="342">Recharge tracking</text>
  </g>

  <!-- mock stat row -->
  <rect x="130" y="390" width="920" height="80" rx="8" fill="#242424"/>
  <text x="155" y="425" font-family="Georgia, serif" font-size="14" fill="#c9a87a">AC</text>
  <text x="155" y="450" font-family="Georgia, serif" font-size="20" fill="#e8e0d8" font-weight="bold">15</text>

  <text x="255" y="425" font-family="Georgia, serif" font-size="14" fill="#c9a87a">HP</text>
  <text x="255" y="450" font-family="Georgia, serif" font-size="20" fill="#4ac96a" font-weight="bold">18 / 22</text>

  <text x="400" y="425" font-family="Georgia, serif" font-size="14" fill="#c9a87a">STR</text>
  <text x="400" y="450" font-family="Georgia, serif" font-size="20" fill="#e8e0d8" font-weight="bold">16 (+3)</text>

  <text x="540" y="425" font-family="Georgia, serif" font-size="14" fill="#c9a87a">DEX</text>
  <text x="540" y="450" font-family="Georgia, serif" font-size="20" fill="#e8e0d8" font-weight="bold">14 (+2)</text>

  <text x="680" y="425" font-family="Georgia, serif" font-size="14" fill="#c9a87a">Attack</text>
  <text x="680" y="450" font-family="Georgia, serif" font-size="18" fill="#e8e0d8">Scimitar +5, 1d6+3</text>

  <text x="130" y="600" font-family="Georgia, serif" font-size="16" fill="#8a7a6a">A free, open-source extension for Owlbear Rodeo</text>
</svg>
